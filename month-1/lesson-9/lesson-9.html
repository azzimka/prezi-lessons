        ['ШИРИНА','lesson','<p class="eyebrow">ПАТТЕРН ВЕРСТКИ</p><h2 class="h2">ЦЕНТРАЛЬНАЯ КОЛОНКА СТРАНИЦЫ</h2><div class="showcase"><article class="card dark"><h3 class="ctitle">ТРИ ПРАВИЛА — ОДНА ЛОГИКА</h3><pre class="code"><code><span class="s">.page-content</span> {\n  <span class="p">width</span>: <span class="v">100%</span>;\n  <span class="p">max-width</span>: <span class="v">1200px</span>;\n  <span class="p">margin</span>: <span class="v">0 auto</span>;\n}</code></pre></article><div class="page-demo"><small>ШИРОКИЙ ЭКРАН</small><i class="page-wide"></i><b class="page-center">ЦЕНТРАЛЬНАЯ<br>КОЛОНКА</b><i class="page-wide"></i><em>свободное пространство остаётся по краям</em></div></div>'],

        ['ШИРИНА','lesson','<p class="eyebrow">НИЖНЯЯ ГРАНИЦА ШИРИНЫ</p><h2 class="h2">СВОЙСТВО MIN-WIDTH</h2><div class="two"><article class="card beige"><p class="eyebrow">БЕЗ ОГРАНИЧЕНИЯ СНИЗУ</p><h3 class="ctitle">width: 100%</h3><pre class="code"><code><span class="s">.container</span> {\n  <span class="p">width</span>: <span class="v">100%</span>;\n}</code></pre><p class="state bad">На узком экране блок сжимается бесконечно.</p></article><article class="card purple"><p class="eyebrow">НИЖНЯЯ ГРАНИЦА</p><h3 class="ctitle">min-width: 500px</h3><span class="limit-rule">MIN-WIDTH = «НЕ МЕНЬШЕ 500PX»</span><pre class="code"><code><span class="s">.container</span> {\n  <span class="p">min-width</span>: <span class="v">500px</span>;\n}</code></pre><p class="state ok" style="margin-top:5px">Блок останавливается на 500px и дальше не сжимается.</p></article></div>'],
        ['ПРОВЕРКА 03','quiz','ЧТО ПРОИЗОЙДЁТ С БЛОКОМ .container { min-width: 500px; } НА ЭКРАНЕ МЕНЬШЕ 500PX?',['Сожмётся меньше 500px','Остановится на 500px и не сожмётся дальше','Исчезнет с экрана','Растянется на 1000px'],1,'Верно: min-width ставит жёсткий нижний предел ширины.'],
        ['ПРАКТИКА 01','lesson','<p class="eyebrow">ВАША ОЧЕРЕДЬ · 5 МИНУТ</p><h2 class="h2">ЗАДАЙТЕ МИНИМАЛЬНУЮ ШИРИНУ</h2><div class="practice"><article class="card yellow"><h3 class="ctitle">ОГРАНИЧЬТЕ СЖАТИЕ</h3><ol class="steps"><li>Создайте блок .container.</li><li>Задайте min-width: 500px.</li><li>Сузьте окно браузера и проверьте предел.</li></ol></article><article class="card"><div class="page-demo" style="min-height:220px"><small>ОКНО СУЖАЕТСЯ</small><b class="page-center" style="width:100%;max-width:320px;height:70px">.container<br><span style="font-size:11px;font-weight:700;color:#333">min-width: 500px</span></b><em>блок не может стать уже 500px</em></div></article></div>'],
        ['РАЗДЕЛ 02','divider','<div class="divider"><div class="divider-num">02</div><div><h2>ВЫСОТА<br>И КОНТЕНТ</h2><div class="line"></div><p>Текст и данные могут стать длиннее, чем мы ожидали.</p></div></div>'],
        ['ВЫСОТА','lesson','<p class="eyebrow">ПРАВИЛО ДЛЯ ТЕКСТОВЫХ БЛОКОВ</p><h2 class="h2">HEIGHT И MIN-HEIGHT</h2><div class="two"><article class="card beige"><h3 class="ctitle">ЖЁСТКАЯ ВЫСОТА</h3><div class="height"><div class="fixed">Длинный текст не исчезает: он визуально выходит за жёсткую границу блока.</div></div><p class="state bad">height: 110px — контент может выйти за рамку.</p></article><article class="card purple"><h3 class="ctitle">БЕЗОПАСНЫЙ МИНИМУМ</h3><div class="height"><div class="min">Длинный текст увеличивает блок вниз: весь контент остаётся внутри его границ.</div></div><p class="state ok">min-height: 110px — блок растёт вместе с содержимым.</p></article></div>'],
        ['ПРОВЕРКА 04','quiz','КАКОЕ СВОЙСТВО ВЫБРАТЬ ДЛЯ БЛОКА, ГДЕ ТЕКСТ МОЖЕТ СТАТЬ ДЛИННЕЕ?',['width','max-width','height','min-height'],3,'Верно: min-height даёт стартовую высоту и разрешает рост.'],
        ['OVERFLOW','lesson','<p class="eyebrow">КОГДА КОНТЕНТ ВЫШЕЛ ЗА ГРАНИЦЫ</p><h2 class="h2">ЧЕТЫРЕ РЕЖИМА OVERFLOW</h2><div class="overflow-grid"><article class="overflow-card"><h3>visible</h3><div class="sample">Контент виден даже тогда, когда выходит за границы небольшого блока.</div><p>Поведение по умолчанию.</p></article><article class="overflow-card"><h3>hidden</h3><div class="sample hidden">Контент, который не помещается, обрезается и не показывается за границей.</div><p>Скрывает лишнее.</p></article><article class="overflow-card"><h3>auto</h3><div class="sample auto">Полоса прокрутки появляется только когда контента действительно стало больше, чем места.</div><p>Обычно лучший выбор.</p></article><article class="overflow-card"><h3>scroll</h3><div class="sample scroll">Прокрутка предусмотрена всегда, даже если текст уже полностью помещается.</div><p>Полоса видна всегда.</p></article></div>'],
        ['ПРОВЕРКА 05','quiz','КАКОЙ РЕЖИМ ПОКАЗЫВАЕТ ПРОКРУТКУ ТОЛЬКО ПРИ НЕОБХОДИМОСТИ?',['overflow: visible','overflow: auto','overflow: hidden','overflow: scroll'],1,'Верно: auto добавляет прокрутку только при переполнении.'],
        ['ПРАКТИКА 02','lesson','<p class="eyebrow">ВАША ОЧЕРЕДЬ · 7 МИНУТ</p><h2 class="h2">СПИСОК С ОГРАНИЧЕННОЙ ВЫСОТОЙ</h2><div class="practice"><article class="card purple"><h3 class="ctitle">СОБЕРИТЕ БЛОК СООБЩЕНИЙ</h3><ol class="steps"><li>Укажите max-height.</li><li>Добавьте overflow-y: auto.</li><li>Проверьте длинный список.</li></ol></article><article class="card"><div class="chat"><b>Первое сообщение остаётся внутри списка.</b><b class="own">Новое сообщение добавлено справа.</b><b>Список растёт, но не бесконечно.</b><b class="own">При переполнении включается прокрутка.</b><b>Ещё одно сообщение для проверки высоты блока.</b><b class="own">Контент остаётся доступным.</b></div></article></div>'],
        ['САМОСТОЯТЕЛЬНО','lesson','<p class="eyebrow">ВАША САМОСТОЯТЕЛЬНАЯ РАБОТА</p><h2 class="h2">СОБЕРИТЕ УСТОЙЧИВЫЙ КАТАЛОГ</h2><div class="homework"><article class="goal"><b>03</b><h3>УСЛОВИЯ ГОТОВОГО МАКЕТА</h3><p>Проверьте макет на длинном тексте и на узком окне.</p></article><article class="card"><ol class="steps"><li>Создайте центральную колонку: width, max-width, margin.</li><li>Разместите минимум четыре карточки во Flexbox.</li><li>Защитите карточку свойством min-width.</li><li>Добавьте блок с max-height и overflow-y: auto.</li></ol><div class="take"><i></i><span>Цель — не «красивый код», а макет, который не ломается от размера и контента.</span></div></article></div>']
      ];
      const deck=document.querySelector('.deck'), prev=document.querySelector('#prev'), next=document.querySelector('#next'), bar=document.querySelector('#bar');
      function brand(topic){return '<header class="slide-header"><div class="brand"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span><span><b class="brand-name">ВЕБ-КУРС</b><span class="brand-sub">ОСНОВЫ CSS</span></span></div><div class="header-lesson">УРОК 09 · '+topic+'</div></header>'}
      function footer(n){return '<footer class="footer"><span>УЧЕБНЫЙ МОДУЛЬ · РАЗМЕРЫ В CSS</span><span>СТРАНИЦА '+String(n).padStart(2,'0')+' / '+(data.length+1)+'</span></footer>'}
      function quiz(q){let answers=q[3].map(function(a,i){return '<div class="answer '+(i===q[4]?'correct':'')+'"><i>'+String.fromCharCode(65+i)+'</i>'+a+'</div>'}).join('');return '<div class="quiz"><div class="quiz-tag"><i></i>ПРОВЕРЬТЕ СЕБЯ · '+q[0].slice(-2)+'</div><h2 class="question">'+q[2]+'</h2><div class="answers">'+answers+'</div><button class="reveal" type="button">Показать ответ</button><p class="answer-note" aria-live="polite">'+q[5]+'</p></div>'}
      data.forEach(function(item,i){let slide=document.createElement('section');slide.className='slide';slide.setAttribute('aria-hidden','true');let inner=item[1]==='quiz'?quiz(item):'<div class="shell">'+item[2]+'</div>';slide.innerHTML=brand(item[0])+'<div class="content">'+inner+'</div>'+footer(i+2);deck.appendChild(slide)});
      const slides=Array.from(document.querySelectorAll('.slide'));let current=0,touchX=0;
      function render(n){current=Math.max(0,Math.min(n,slides.length-1));slides.forEach(function(s,i){s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true')});prev.disabled=current===0;next.disabled=current===slides.length-1;bar.style.width=((current+1)/slides.length*100)+'%';document.title='Урок 9 · Слайд '+(current+1)+' из '+slides.length}
      prev.addEventListener('click',function(){render(current-1)});next.addEventListener('click',function(){render(current+1)});
      document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();render(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();render(current-1)}if(e.key==='Home'){e.preventDefault();render(0)}if(e.key==='End'){e.preventDefault();render(slides.length-1)}});
      document.addEventListener('touchstart',function(e){touchX=e.changedTouches[0].screenX},{passive:true});document.addEventListener('touchend',function(e){let d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>55)render(current+(d<0?1:-1))},{passive:true});
      document.addEventListener('click',function(e){if(e.target.classList.contains('reveal')){let q=e.target.closest('.quiz');let open=q.classList.toggle('revealed');e.target.textContent=open?'Скрыть ответ':'Показать ответ'}});
      render(0);
    }());
  </script>
  <script src="/mobile-block.js"></script>
</body>
