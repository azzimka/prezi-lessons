  <style>

    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{font-family:Montserrat,sans-serif;background:var(--bg);color:var(--black);overflow:hidden}.deck{width:100%;height:100%;position:relative}.slide{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg)}.slide.active{display:flex}

    .title{justify-content:space-between}.rings{position:absolute;border:2px solid rgba(10,10,10,.08);border-radius:50%;pointer-events:none}.ring-a{width:390px;height:390px;right:-80px;top:-115px}.ring-b{width:235px;height:235px;right:95px;top:65px}.title-top{display:flex;justify-content:space-between;padding:32px 56px 0}.title-brand{display:flex;align-items:center;gap:14px}.mode{text-align:right}.mode small,.id small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.14em}.mode b,.id b{display:block;margin-top:5px;font-size:14px;letter-spacing:.06em}.title-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.badge{padding:8px 18px;border-radius:99px;background:var(--black);color:var(--white);font-size:12px;font-weight:800;letter-spacing:.14em}.title-main{margin-top:22px;font-size:clamp(56px,5.5vw,82px);font-weight:900;letter-spacing:-.075em;line-height:.95}.title-ital{font:900 italic clamp(64px,6.5vw,94px)/.95 'Playfair Display',serif;letter-spacing:-.065em}.title-lines{display:flex;align-items:center;gap:20px;margin:8px 0}.title-lines i{width:76px;height:5px;border-radius:6px;background:var(--yellow)}.title-third{font-size:clamp(28px,3vw,44px);font-weight:900;letter-spacing:-.06em}.title-sub{max-width:700px;margin-top:22px;font-size:20px;line-height:1.4;color:var(--muted)}.title-bottom{display:flex;justify-content:space-between;align-items:flex-end;padding:0 280px 28px 56px}.slogan{font-size:13px;font-weight:900;letter-spacing:.1em}.dashes{display:flex;gap:8px;margin-top:8px}.dashes i{height:4px;border-radius:6px;background:var(--yellow)}.dashes i:first-child{width:40px}.dashes i:last-child{width:22px}
    .toc-title{display:flex;align-items:center;gap:15px;margin-bottom:24px;font-size:36px;font-weight:900;letter-spacing:-.03em}.toc-mark{position:relative;width:32px;height:32px;border-radius:9px;background:var(--yellow)}.toc-mark:before,.toc-mark:after{content:'';position:absolute;left:8px;width:16px;height:3px;border-radius:4px;background:var(--black)}.toc-mark:before{top:10px}.toc-mark:after{top:18px}.toc{display:grid;grid-template-columns:1fr 1fr;gap:11px}.toc div{display:flex;align-items:center;gap:16px;min-height:64px;padding:14px 20px;border-radius:14px;font-size:15px;font-weight:800;letter-spacing:.02em}.toc b{min-width:29px;font-size:18px}.toc .black{background:var(--black);color:var(--white)}
    .mm{position:relative;min-height:400px;margin-top:10px}.mm .wires{position:absolute;inset:0;width:100%;height:100%}.mm .wires line{stroke:rgba(10,10,10,.16);stroke-width:3;stroke-linecap:round}.mm-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:var(--black);color:#fff;border-radius:22px;padding:22px 32px;text-align:center;box-shadow:0 14px 32px rgba(10,10,10,.2)}.mm-center small{display:block;font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--yellow);margin-bottom:8px}.mm-center b{display:block;font:900 30px/1 Unbounded,Montserrat,sans-serif;letter-spacing:-.05em}.mm-node{position:absolute;width:28%;z-index:2;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px 16px}.mm-node.beige{background:var(--beige);border-color:#dfd6c0}.mm-node.purple{background:var(--purple);border-color:transparent}.mm-node.yellow{background:var(--yellow);border-color:transparent}.mm-node .k{display:block;font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--label);margin-bottom:6px}.mm-node p{margin:0;font-size:14px;font-weight:600;line-height:1.4}.mm-node .sn{display:block;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--code);color:#f8f8ff;font:12px/1.55 'SF Mono','Fira Code',Menlo,monospace;white-space:pre}.n-tl{left:0;top:0}.n-tr{right:0;top:0}.n-bl{left:0;bottom:0}.n-br{right:0;bottom:0}
    .practice{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}.steps{display:grid;gap:11px;margin:16px 0 0;padding:0;list-style:none;counter-reset:step}.steps li{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;line-height:1.35}.steps li:before{counter-increment:step;content:counter(step,decimal-leading-zero);display:grid;place-items:center;width:31px;height:31px;flex:none;border-radius:8px;background:var(--yellow);font-size:11px;font-weight:900}.practice .card{min-height:300px}
    .nav{position:fixed;right:36px;bottom:16px;z-index:5;display:flex;gap:8px}.nav button{display:grid;place-items:center;width:58px;height:58px;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--white);cursor:pointer}.nav button:hover:not(:disabled){background:var(--yellow);border-color:var(--yellow)}.nav button:disabled{opacity:.45;cursor:default}.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.progress{position:fixed;left:56px;right:210px;bottom:10px;height:4px;border-radius:9px;background:rgba(10,10,10,.1);z-index:4}.progress i{display:block;width:12.5%;height:100%;border-radius:inherit;background:var(--yellow);transition:width .2s ease}.skip{position:fixed;z-index:10;left:16px;top:-60px;padding:10px 14px;background:var(--yellow);color:var(--black);font-weight:800}.skip:focus{top:12px}
    @media(max-width:900px){.slide-header{padding:20px 24px 0}.content{align-items:flex-start;overflow-y:auto;padding:14px 24px 80px}.footer{display:none}.title-top{padding:24px 24px 0}.title-bottom{padding:0 24px 84px}.mode{display:none}.h2{white-space:normal}.practice{grid-template-columns:1fr}.toc{grid-template-columns:1fr}.mm{min-height:0;display:grid;gap:12px}.mm .wires{display:none}.mm-center,.mm-node{position:static;transform:none;width:100%}.mm-center{order:-1}.nav{right:18px}.nav button{width:50px;height:50px}.progress{left:24px;right:150px}}@media(max-width:520px){.brand-name{font-size:18px}.header-lesson{font-size:10px}.title-main{font-size:46px}.title-ital{font-size:56px}.title-third{font-size:24px}.title-sub{font-size:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;scroll-behavior:auto!important}}

<body>

      <div class="title-top"><div class="title-brand"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span><span><b class="brand-name">ВЕБ-КУРС</b><span class="brand-sub">ОСНОВЫ РАЗРАБОТКИ</span></span></div><div class="mode"><small>ФОРМАТ ОБУЧЕНИЯ</small><b>ПРАКТИЧЕСКИЙ КУРС</b></div></div>
      <div class="title-center"><span class="badge">УРОК 10 · CSS</span><div class="title-main">ПОЗИЦИИ</div><div class="title-lines"><i></i><div class="title-ital">в CSS</div><i></i></div><div class="title-third">RELATIVE · ABSOLUTE · FIXED</div><p class="title-sub">Управляем расположением элементов: сдвиг от места, выход из потока и фиксация на экране.</p></div>
      <div class="title-bottom"><span class="id"><small>ID КУРСА</small><b>HTML-CSS-DEV</b></span><span><b class="slogan">ИЗУЧАЙ · КОД · СОЗДАВАЙ</b><span class="dashes"><i></i><i></i></span></span></div>
    </section>
  </main>
  <nav class="nav" aria-label="Навигация по слайдам"><button id="prev" type="button" aria-label="Предыдущий слайд" disabled><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button><button id="next" type="button" aria-label="Следующий слайд"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></nav>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <script>
    (function(){
      var WIRES='<svg class="wires" viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true"><line x1="500" y1="200" x2="292" y2="82"/><line x1="500" y1="200" x2="708" y2="82"/><line x1="500" y1="200" x2="292" y2="318"/><line x1="500" y1="200" x2="708" y2="318"/></svg>';
      function mm(centerSmall,centerBig,nodes){
        var html='<div class="mm">'+WIRES+'<div class="mm-center"><small>'+centerSmall+'</small><b>'+centerBig+'</b></div>';
        var pos=['n-tl','n-tr','n-bl','n-br'];
        var tones=['','beige','purple','yellow'];
        nodes.forEach(function(n,i){
          html+='<div class="mm-node '+pos[i]+' '+tones[i]+'"><span class="k">'+n[0]+'</span><p>'+n[1]+'</p>'+(n[2]?'<span class="sn">'+n[2]+'</span>':'')+'</div>';
        });
        return html+'</div>';
      }
      var data=[
        ['СОДЕРЖАНИЕ','<div class="toc-title"><i class="toc-mark"></i>СОДЕРЖАНИЕ УРОКА</div><div class="toc"><div class="card"><b>01</b>ОБЩАЯ КАРТА</div><div class="yellow"><b>02</b>RELATIVE</div><div class="purple"><b>03</b>ABSOLUTE</div><div class="beige"><b>04</b>FIXED</div><div class="black"><b>05</b>Z-INDEX</div><div class="card"><b>06</b>ПРАКТИКА</div></div>'],
        ['ОБЩАЯ КАРТА','<p class="eyebrow">МЕНТАЛЬНАЯ КАРТА · ОСНОВА</p><h2 class="h2">ЧЕТЫРЕ РЕЖИМА POSITION</h2>'+mm('СВОЙСТВО','position',[
          ['STATIC · ПО УМОЛЧАНИЮ','Обычный поток документа. Свойства top / left / right / bottom не работают.'],
          ['RELATIVE · СДВИГ','Сдвигается относительно своего места. Место в потоке сохраняется.'],
          ['ABSOLUTE · СВОБОДА','Вырван из потока. Позиционируется от ближайшего positioned-родителя.'],
          ['FIXED · ФИКСАЦИЯ','Привязан к окну браузера. Остаётся на месте при прокрутке.']
        ])],
        ['RELATIVE','<p class="eyebrow">МЕНТАЛЬНАЯ КАРТА · 01</p><h2 class="h2">POSITION: RELATIVE</h2>'+mm('POSITION','relative',[
          ['В ПОТОКЕ','Место элемента сохраняется — соседи не сдвигаются.'],
          ['СДВИГ','top / right / bottom / left двигают элемент от его исходной точки.','.box {\n  position: relative;\n  top: 20px;\n  left: 10px;\n}'],
          ['ЯКОРЬ','Становится точкой отсчёта для absolute-детей внутри него.'],
          ['КОГДА НУЖЕН','Небольшой сдвиг элемента или контейнер для бейджа и подсказок.']
        ])],
        ['ABSOLUTE','<p class="eyebrow">МЕНТАЛЬНАЯ КАРТА · 02</p><h2 class="h2">POSITION: ABSOLUTE</h2>'+mm('POSITION','absolute',[
          ['ВНЕ ПОТОКА','Место исчезает — соседние элементы занимают его.'],
          ['ТОЧКА ОТСЧЁТА','Ближайший родитель с position не static. Нет такого — отсчёт от страницы.'],
          ['КООРДИНАТЫ','top / left / right / bottom — от краёв этого родителя.','.badge {\n  position: absolute;\n  top: 12px;\n  right: 12px;\n}'],
          ['ТИПИЧНЫЙ ПРИМЕР','Бейдж «NEW» в углу карточки товара.']
        ])],
        ['FIXED','<p class="eyebrow">МЕНТАЛЬНАЯ КАРТА · 03</p><h2 class="h2">POSITION: FIXED</h2>'+mm('POSITION','fixed',[
          ['ОКНО БРАУЗЕРА','Координаты всегда считаются от viewport, а не от родителя.'],
          ['НЕ СКРОЛЛИТСЯ','Остаётся на месте, когда страница прокручивается.','.header {\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n}'],
          ['ПРИМЕНЕНИЕ','Шапка сайта, кнопка «наверх», окно чата.'],
          ['ОСТОРОЖНО','Перекрывает контент — добавь отступ сверху у страницы.']
        ])],
        ['Z-INDEX','<p class="eyebrow">МЕНТАЛЬНАЯ КАРТА · 04</p><h2 class="h2">Z-INDEX · ПОРЯДОК СЛОЁВ</h2>'+mm('СЛОИ','z-index',[
          ['КТО СВЕРХУ','Больше число — выше слой при наложении элементов.'],
          ['УСЛОВИЕ','Работает только у элементов с position: relative / absolute / fixed.'],
          ['ПРИМЕР','Модальное окно поверх всего остального.','.modal {\n  position: fixed;\n  z-index: 100;\n}'],
          ['ЛОВУШКА','Без position свойство z-index просто не сработает.']
        ])],
        ['ПРАКТИКА','<p class="eyebrow">ВАША ОЧЕРЕДЬ · 10 МИНУТ</p><h2 class="h2">ЗАКРЕПИТЕ ПОЗИЦИИ</h2><div class="practice"><article class="card yellow"><h3 class="ctitle">БЕЙДЖ «NEW»</h3><ol class="steps"><li>Карточке задайте position: relative.</li><li>Бейджу — absolute; top: 12px; right: 12px.</li><li>Проверьте: бейдж сидит в углу карточки.</li></ol></article><article class="card purple"><h3 class="ctitle">ФИКСИРОВАННАЯ ШАПКА</h3><ol class="steps"><li>Шапке задайте fixed; top: 0; left: 0; right: 0.</li><li>Контенту добавьте padding-top по высоте шапки.</li><li>Прокрутите страницу — шапка на месте.</li></ol></article></div>']
      ];
      var deck=document.querySelector('.deck'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),bar=document.querySelector('#bar');
      function brand(topic){return '<header class="slide-header"><div class="brand"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span><span><b class="brand-name">ВЕБ-КУРС</b><span class="brand-sub">ОСНОВЫ CSS</span></span></div><div class="header-lesson">УРОК 10 · '+topic+'</div></header>'}
      function footer(n){return '<footer class="footer"><span>УЧЕБНЫЙ МОДУЛЬ · ПОЗИЦИОНИРОВАНИЕ В CSS</span><span>СТРАНИЦА '+String(n).padStart(2,'0')+' / '+(data.length+1)+'</span></footer>'}
      data.forEach(function(item,i){var slide=document.createElement('section');slide.className='slide';slide.setAttribute('aria-hidden','true');slide.innerHTML=brand(item[0])+'<div class="content"><div class="shell">'+item[1]+'</div></div>'+footer(i+2);deck.appendChild(slide)});
      var slides=Array.from(document.querySelectorAll('.slide'));var current=0,touchX=0;
      function render(n){current=Math.max(0,Math.min(n,slides.length-1));slides.forEach(function(s,i){s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true')});prev.disabled=current===0;next.disabled=current===slides.length-1;bar.style.width=((current+1)/slides.length*100)+'%';document.title='Урок 10 · Слайд '+(current+1)+' из '+slides.length}
      prev.addEventListener('click',function(){render(current-1)});next.addEventListener('click',function(){render(current+1)});
      document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();render(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();render(current-1)}if(e.key==='Home'){e.preventDefault();render(0)}if(e.key==='End'){e.preventDefault();render(slides.length-1)}});
      document.addEventListener('touchstart',function(e){touchX=e.changedTouches[0].screenX},{passive:true});document.addEventListener('touchend',function(e){var d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>55)render(current+(d<0?1:-1))},{passive:true});
      render(0);
    }());
  </script>
