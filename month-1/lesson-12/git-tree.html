<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git: Commit, Branch, Merge — Метафора Дуба</title>
  <style>
    :root {
      --bg: #07080D;
      --gold: #DFFF4F;
      --gold-glow: #F5E050;
      --cyan: #38BDF8;
      --pink: #F43F5E;
      --wood-dark: #12100E;
      --wood-mid: #25201C;
      --wood-light: #4A3E35;
      --text-light: #F5F1E6;
      --text-muted: #9D9DAF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-light);
      user-select: none;
    }
    #stage {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg.canvas {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: block;
      transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-origin: 50% 60%;
    }
    .zoom-out {
      transform: scale(0.93) translateY(-10px);
    }

    /* Анимация роста веток */
    .branch-path {
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      transition: stroke-dashoffset 1.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .branch-grown {
      stroke-dashoffset: 0 !important;
    }

    /* Узлы коммитов */
    .commit-node {
      opacity: 0;
      transform: scale(0.3);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .commit-visible {
      opacity: 1 !important;
      transform: scale(1) !important;
    }
    .pulse-ring {
      animation: pulse 2.5s infinite ease-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse {
      0% { r: 14; opacity: 0.9; }
      100% { r: 36; opacity: 0; }
    }

    /* Подписи и выноски */
    .annotation {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }
    .annotation-visible {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }
    .anno-card {
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.85));
    }
    .anno-title {
      font-size: 26px;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: -0.02em;
    }
    .anno-hash {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .anno-msg {
      font-size: 22px;
      font-weight: 600;
      fill: #DDDDE8;
    }

    /* Маркер HEAD */
    #head-marker {
      opacity: 0;
      transition: transform 1s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.5s ease;
    }

    /* Бирка v1.0 */
    #tag-badge {
      opacity: 0;
      transform: scale(0.5);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #tag-badge.tag-visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Вспышка слияния */
    .merge-flash {
      opacity: 0;
      transform: scale(0.5);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 0.3s ease, transform 0.8s ease-out;
    }
    .merge-flash.flash-active {
      opacity: 1;
      transform: scale(3.5);
    }

    /* Легенда */
    #legend-card {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
    }
    #legend-card.legend-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Верхний HUD / Шапка */
    .hud-top {
      position: absolute;
      top: 36px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-title-group {
      max-width: 900px;
    }
    .hud-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .hud-step-badge {
      background: rgba(223, 255, 79, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 13px;
    }
    .hud-heading {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      margin-bottom: 6px;
      transition: opacity 0.3s ease;
    }
    .hud-desc {
      font-size: 22px;
      font-weight: 500;
      color: #B5B5C8;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      transition: opacity 0.3s ease;
    }

    /* Нижняя панель управления */
    .hud-controls {
      position: absolute;
      bottom: 28px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .controls-keys {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .key-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #EEE;
    }
    .key-pill kbd {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: inherit;
      color: var(--gold);
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(18, 19, 26, 0.85);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }
    .btn:hover:not(:disabled) {
      background: var(--gold);
      border-color: var(--gold);
      color: #07080D;
      transform: translateY(-2px);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
    }
    .btn-primary {
      background: var(--gold);
      color: #07080D;
      border-color: var(--gold);
    }
    .btn-primary:hover {
      background: #FFF;
      border-color: #FFF;
    }

    /* Индикатор прогресса шагов */
    .progress-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .p-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .p-dot.active {
      width: 32px;
      border-radius: 12px;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
    }
    .p-dot.done {
      background: rgba(223, 255, 79, 0.6);
    }
  </style>
</head>
<body>
  <div id="stage">
    <svg class="canvas" id="canvas" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Свечение для коммитов и веток -->
        <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
        </filter>

        <!-- Градиенты сцены -->
        <radialGradient id="sky-grad" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#141728" />
          <stop offset="45%" stop-color="#0B0C16" />
          <stop offset="100%" stop-color="#05060A" />
        </radialGradient>
        <radialGradient id="moon-glow" cx="50%" cy="10%" r="55%">
          <stop offset="0%" stop-color="rgba(190, 215, 255, 0.15)" />
          <stop offset="50%" stop-color="rgba(190, 215, 255, 0.04)" />
          <stop offset="100%" stop-color="rgba(0,0,0,0)" />
        </radialGradient>
        <linearGradient id="hill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#12131C" />
          <stop offset="100%" stop-color="#06060A" />
        </linearGradient>

        <!-- Градиенты дерева -->
        <linearGradient id="trunk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#181512" />
          <stop offset="40%" stop-color="#2D2520" />
          <stop offset="85%" stop-color="#4F4236" />
          <stop offset="100%" stop-color="#221C17" />
        </linearGradient>
      </defs>

      <!-- 1. НОЧНОЕ НЕБО И ЛУННОЕ СВЕЧЕНИЕ -->
      <rect width="1920" height="1080" fill="url(#sky-grad)" />
      <circle cx="960" cy="80" r="680" fill="url(#moon-glow)" />

      <!-- 2. СИЛУЭТ ХОЛМА (ЗЕМЛЯ) -->
      <path d="M -80 1080 L -80 930 Q 380 870 960 890 Q 1540 910 2000 930 L 2000 1080 Z" fill="url(#hill-grad)" />
      <path d="M -80 1080 L -80 950 Q 500 920 1040 935 Q 1600 950 2000 970 L 2000 1080 Z" fill="#08080C" opacity="0.6" />

      <!-- 3. ДРЕВНИЙ ОДУБ (ВЕКТОРНЫЙ СТВОЛ И ВЕТВИ БЕЗ ЛИСТЬЕВ) -->
      <g id="tree-wood" opacity="0.95">
        <!-- Корневая система -->
        <path d="M 960 920 Q 860 940 760 990 Q 720 1010 660 1050 L 640 1060 Q 720 1030 810 990 Q 890 960 940 925 Z" fill="#181512" />
        <path d="M 960 920 Q 1060 940 1160 990 Q 1210 1015 1270 1055 L 1290 1065 Q 1210 1030 1120 990 Q 1030 955 980 925 Z" fill="#3D322A" />
        <path d="M 945 925 Q 920 970 880 1030 Q 860 1060 840 1080 Q 870 1050 905 1000 Q 935 960 955 925 Z" fill="#241E19" />
        <path d="M 975 925 Q 1000 970 1040 1030 Q 1065 1060 1080 1080 Q 1050 1050 1015 1000 Q 985 960 965 925 Z" fill="#3A3028" />

        <!-- Основной ствол дуба -->
        <path d="M 915 920 Q 900 830 910 750 Q 925 660 925 580 Q 920 480 910 390 Q 895 300 910 200 Q 915 150 930 100 L 970 100 Q 985 160 985 210 Q 1000 310 990 400 Q 980 500 985 600 Q 995 700 1005 770 Q 1020 840 1005 920 Z" fill="url(#trunk-grad)" />

        <!-- Кора: вертикальные трещины и прожилки -->
        <path d="M 935 910 Q 925 800 935 700 Q 945 610 940 500 Q 935 390 940 280 Q 945 200 945 130" stroke="#120F0D" stroke-width="4" fill="none" opacity="0.7" />
        <path d="M 955 910 Q 948 780 960 670 Q 965 570 955 460 Q 950 360 955 260 Q 960 180 958 120" stroke="#5C4D40" stroke-width="3" fill="none" opacity="0.6" />
        <path d="M 975 910 Q 970 820 980 730 Q 980 630 972 520 Q 968 420 972 320 Q 975 220 970 140" stroke="#261F1A" stroke-width="3.5" fill="none" opacity="0.7" />

        <!-- Крона: мощные боковые дубовые сучья (фоновые органические ветви) -->
        <!-- Левый крупный сук -->
        <path d="M 920 680 Q 820 660 740 640 Q 640 610 560 560 Q 480 510 420 440 Q 360 370 320 280" stroke="#2C241E" stroke-width="32" stroke-linecap="round" fill="none" />
        <path d="M 920 680 Q 820 660 740 640 Q 640 610 560 560 Q 480 510 420 440 Q 360 370 320 280" stroke="#483B31" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" />
        <!-- Ответвления левого сука -->
        <path d="M 740 640 Q 700 580 660 510 Q 620 440 600 360" stroke="#251F19" stroke-width="18" stroke-linecap="round" fill="none" />
        <path d="M 560 560 Q 520 480 500 400 Q 480 320 490 240" stroke="#201914" stroke-width="14" stroke-linecap="round" fill="none" />
        <path d="M 420 440 Q 380 400 340 370 Q 300 340 260 320" stroke="#1A1410" stroke-width="10" stroke-linecap="round" fill="none" />
        <path d="M 320 280 Q 280 250 240 240 Q 190 230 140 240" stroke="#14100C" stroke-width="7" stroke-linecap="round" fill="none" />

        <!-- Правый крупный сук -->
        <path d="M 985 710 Q 1080 690 1180 670 Q 1290 640 1380 580 Q 1480 510 1550 430 Q 1620 350 1670 250" stroke="#3A2F27" stroke-width="34" stroke-linecap="round" fill="none" />
        <path d="M 985 710 Q 1080 690 1180 670 Q 1290 640 1380 580 Q 1480 510 1550 430 Q 1620 350 1670 250" stroke="#5A4A3E" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7" />
        <!-- Ответвления правого сука -->
        <path d="M 1180 670 Q 1240 600 1290 520 Q 1340 440 1360 360" stroke="#2E241D" stroke-width="20" stroke-linecap="round" fill="none" />
        <path d="M 1380 580 Q 1440 500 1480 420 Q 1520 330 1530 250" stroke="#251D17" stroke-width="15" stroke-linecap="round" fill="none" />
        <path d="M 1550 430 Q 1610 390 1660 350 Q 1720 310 1780 290" stroke="#1C1612" stroke-width="11" stroke-linecap="round" fill="none" />
        <path d="M 1670 250 Q 1720 220 1780 200 Q 1830 190 1880 200" stroke="#15110E" stroke-width="7" stroke-linecap="round" fill="none" />

        <!-- Верхняя крона (высокие ветви) -->
        <path d="M 930 430 Q 860 350 800 280 Q 740 200 700 120" stroke="#2E251E" stroke-width="22" stroke-linecap="round" fill="none" />
        <path d="M 970 410 Q 1040 330 1110 260 Q 1190 180 1240 100" stroke="#3D3228" stroke-width="24" stroke-linecap="round" fill="none" />
        <path d="M 930 240 Q 880 180 840 120 Q 800 60 770 10" stroke="#241C16" stroke-width="15" stroke-linecap="round" fill="none" />
        <path d="M 970 230 Q 1020 170 1070 110 Q 1120 50 1150 10" stroke="#332921" stroke-width="16" stroke-linecap="round" fill="none" />
        <path d="M 950 130 Q 930 80 920 30" stroke="#221A15" stroke-width="11" stroke-linecap="round" fill="none" />
        <path d="M 955 130 Q 975 80 985 30" stroke="#2A211A" stroke-width="11" stroke-linecap="round" fill="none" />
      </g>

      <!-- 4. СВЕТОВЫЕ ЖИЛЫ GIT (ТРАЕКТОРИИ КОНТРОЛЯ ВЕРСИЙ) -->
      <!-- Ветка main: золотое свечение по стволу -->
      <path id="path-main" class="branch-path" d="M 960 910 L 950 760 L 970 610 L 955 460 L 950 310 L 950 170"
            stroke="url(#grad-path-main)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow-gold)" />
      <linearGradient id="grad-path-main" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#DFFF4F" />
        <stop offset="100%" stop-color="#FFF066" />
      </linearGradient>

      <!-- Ветка feature/login: голубая жила -->
      <path id="path-feature" class="branch-path" d="M 950 760 Q 1080 730 1210 680 Q 1330 630 1360 520"
            stroke="var(--cyan)" stroke-width="11" stroke-linecap="round" fill="none" filter="url(#glow-cyan)" />

      <!-- Merge-дуга feature/login -> main: врастает обратно в ствол -->
      <path id="path-feature-merge" class="branch-path" d="M 1360 520 Q 1380 410 1230 350 Q 1070 310 950 310"
            stroke="var(--cyan)" stroke-width="9" stroke-linecap="round" stroke-dasharray="8 6" fill="none" filter="url(#glow-cyan)" />

      <!-- Ветка bugfix/nav: розовая жила -->
      <path id="path-bugfix" class="branch-path" d="M 970 610 Q 860 590 770 560"
            stroke="var(--pink)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow-pink)" />

      <!-- Merge-дуга bugfix/nav -> main -->
      <path id="path-bugfix-merge" class="branch-path" d="M 770 560 Q 730 500 830 470 Q 890 460 955 460"
            stroke="var(--pink)" stroke-width="8" stroke-linecap="round" stroke-dasharray="6 5" fill="none" filter="url(#glow-pink)" />

      <!-- 5. ВСПЫШКИ СЛИЯНИЯ (MERGE FLASH) -->
      <circle id="flash-bugfix" class="merge-flash" cx="955" cy="460" r="30" fill="var(--pink)" filter="url(#glow-pink)" />
      <circle id="flash-feature" class="merge-flash" cx="950" cy="310" r="45" fill="var(--gold)" filter="url(#glow-gold)" />

      <!-- 6. COMMIT-УЗЛЫ (СВЕТЯЩИЕСЯ ТОЧКИ НА ВЕТВЯХ) -->
      <!-- C1: Initial commit (960, 910) -->
      <g id="commit-1" class="commit-node" data-step="1">
        <circle class="pulse-ring" cx="960" cy="910" r="16" fill="none" stroke="var(--gold)" stroke-width="3" />
        <circle cx="960" cy="910" r="16" fill="#0A0A0E" stroke="var(--gold)" stroke-width="5" filter="url(#glow-gold)" />
        <circle cx="960" cy="910" r="7" fill="#FFFFFF" />
      </g>

      <!-- C2: Add layout (950, 760) -->
      <g id="commit-2" class="commit-node" data-step="2">
        <circle cx="950" cy="760" r="15" fill="#0A0A0E" stroke="var(--gold)" stroke-width="5" filter="url(#glow-gold)" />
        <circle cx="950" cy="760" r="6" fill="#FFFFFF" />
      </g>

      <!-- C3: Create header (970, 610) -->
      <g id="commit-3" class="commit-node" data-step="2">
        <circle cx="970" cy="610" r="15" fill="#0A0A0E" stroke="var(--gold)" stroke-width="5" filter="url(#glow-gold)" />
        <circle cx="970" cy="610" r="6" fill="#FFFFFF" />
      </g>

      <!-- C4: feature/login - Add auth form (1210, 680) -->
      <g id="commit-4" class="commit-node" data-step="4">
        <circle cx="1210" cy="680" r="15" fill="#0A0A0E" stroke="var(--cyan)" stroke-width="5" filter="url(#glow-cyan)" />
        <circle cx="1210" cy="680" r="6" fill="#FFFFFF" />
      </g>

      <!-- C5: feature/login - Connect API (1360, 520) -->
      <g id="commit-5" class="commit-node" data-step="4">
        <circle cx="1360" cy="520" r="15" fill="#0A0A0E" stroke="var(--cyan)" stroke-width="5" filter="url(#glow-cyan)" />
        <circle cx="1360" cy="520" r="6" fill="#FFFFFF" />
      </g>

      <!-- C6: main - Fix footer (955, 460 - до слияния) -->
      <g id="commit-6" class="commit-node" data-step="4">
        <circle cx="955" cy="460" r="14" fill="#0A0A0E" stroke="var(--gold)" stroke-width="4" filter="url(#glow-gold)" />
        <circle cx="955" cy="460" r="5" fill="#FFFFFF" />
      </g>

      <!-- C7: bugfix - Fix mobile nav (770, 560) -->
      <g id="commit-7" class="commit-node" data-step="5">
        <circle cx="770" cy="560" r="14" fill="#0A0A0E" stroke="var(--pink)" stroke-width="5" filter="url(#glow-pink)" />
        <circle cx="770" cy="560" r="6" fill="#FFFFFF" />
      </g>

      <!-- C8: Merge bugfix commit (955, 460) -->
      <g id="commit-merge-bugfix" class="commit-node" data-step="5">
        <circle cx="955" cy="460" r="19" fill="#0A0A0E" stroke="var(--gold)" stroke-width="5" filter="url(#glow-gold)" />
        <circle cx="955" cy="460" r="8" fill="var(--pink)" />
      </g>

      <!-- C9: Merge feature/login commit (950, 310) -->
      <g id="commit-merge-feature" class="commit-node" data-step="6">
        <circle class="pulse-ring" cx="950" cy="310" r="18" fill="none" stroke="var(--gold)" stroke-width="3" />
        <circle cx="950" cy="310" r="21" fill="#0A0A0E" stroke="var(--gold)" stroke-width="6" filter="url(#glow-gold)" />
        <circle cx="950" cy="310" r="9" fill="var(--cyan)" />
      </g>

      <!-- C10: Release commit v1.0 (950, 170) -->
      <g id="commit-release" class="commit-node" data-step="7">
        <circle class="pulse-ring" cx="950" cy="170" r="18" fill="none" stroke="var(--gold)" stroke-width="3" />
        <circle cx="950" cy="170" r="20" fill="#0A0A0E" stroke="var(--gold)" stroke-width="6" filter="url(#glow-gold)" />
        <circle cx="950" cy="170" r="8" fill="#FFFFFF" />
      </g>

      <!-- 7. ТЭГ v1.0 (ЗОЛОТАЯ БИРКА) -->
      <g id="tag-badge" transform="translate(1000, 140)">
        <path d="M 0 10 L 25 -10 L 140 -10 Q 150 -10 150 0 L 150 40 Q 150 50 140 50 L 25 50 Z"
              fill="var(--gold)" filter="url(#shadow-dark)" />
        <circle cx="16" cy="20" r="6" fill="#0A0A0E" />
        <text x="45" y="32" font-size="28" font-weight="900" fill="#0A0A0E" letter-spacing="0.05em">v1.0</text>
        <line x1="-50" y1="30" x2="0" y2="20" stroke="var(--gold)" stroke-width="3" stroke-dasharray="4 4" />
      </g>

      <!-- 8. УКАЗАТЕЛЬ HEAD (СВЕТЯЩИЙСЯ МАРКЕР) -->
      <g id="head-marker">
        <!-- Аура HEAD -->
        <circle cx="0" cy="0" r="26" fill="rgba(223, 255, 79, 0.25)" filter="url(#glow-gold)" />
        <!-- Стрелка-указатель -->
        <polygon points="0,-32 10,-48 -10,-48" fill="var(--gold)" />
        <!-- Бейдж HEAD -->
        <rect x="-42" y="-82" width="84" height="32" rx="16" fill="#0A0A0E" stroke="var(--gold)" stroke-width="2.5" filter="url(#shadow-dark)" />
        <text x="0" y="-61" font-size="16" font-weight="900" fill="var(--gold)" text-anchor="middle" letter-spacing="0.1em">HEAD</text>
      </g>

      <!-- 9. ВЫНОСКИ И ПОДПИСИ К УЗЛАМ (ANNOTATIONS) -->
      <!-- Подпись C1 -->
      <g id="anno-1" class="annotation" data-step="1">
        <line x1="960" y1="910" x2="1140" y2="910" stroke="rgba(223, 255, 79, 0.5)" stroke-width="2" stroke-dasharray="4 4" />
        <g class="anno-card" transform="translate(1160, 875)">
          <rect width="360" height="74" rx="14" fill="#0E101A" stroke="rgba(223, 255, 79, 0.6)" stroke-width="1.8" />
          <text x="20" y="32" class="anno-hash" fill="var(--gold)">#1 · a1b2c3d</text>
          <text x="20" y="58" class="anno-msg">Initial commit (корень)</text>
        </g>
      </g>

      <!-- Подпись Main-ствола C2 / C3 -->
      <g id="anno-main" class="annotation" data-step="2">
        <line x1="970" y1="610" x2="1150" y2="610" stroke="rgba(223, 255, 79, 0.5)" stroke-width="2" stroke-dasharray="4 4" />
        <g class="anno-card" transform="translate(1170, 575)">
          <rect width="390" height="82" rx="14" fill="#0E101A" stroke="rgba(223, 255, 79, 0.6)" stroke-width="1.8" />
          <text x="20" y="32" class="anno-hash" fill="var(--gold)">main: ствол проекта</text>
          <text x="20" y="62" class="anno-msg">e4f5a6b: Create header</text>
        </g>
      </g>

      <!-- Подпись Ветки Feature C4 / C5 -->
      <g id="anno-feature" class="annotation" data-step="3">
        <line x1="1210" y1="680" x2="1380" y2="730" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-dasharray="4 4" />
        <g class="anno-card" transform="translate(1400, 700)">
          <rect width="440" height="84" rx="14" fill="#0A121E" stroke="rgba(56, 189, 248, 0.8)" stroke-width="2" />
          <text x="20" y="34" class="anno-hash" fill="var(--cyan)">branch feature/login</text>
          <text x="20" y="64" class="anno-msg">Новая изолированная ветвь</text>
        </g>
      </g>

      <!-- Подпись C5 Connect API -->
      <g id="anno-c5" class="annotation" data-step="4">
        <line x1="1360" y1="520" x2="1480" y2="520" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" stroke-dasharray="4 4" />
        <g class="anno-card" transform="translate(1500, 485)">
          <rect width="370" height="76" rx="14" fill="#0A121E" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.8" />
          <text x="20" y="32" class="anno-hash" fill="var(--cyan)">b1c2d3e (feature)</text>
          <text x="20" y="58" class="anno-msg">Connect auth API</text>
        </g>
      </g>

      <!-- Подпись Bugfix C7 -->
      <g id="anno-bugfix" class="annotation" data-step="5">
        <line x1="770" y1="560" x2="620" y2="560" stroke="rgba(244, 63, 94, 0.6)" stroke-width="2" stroke-dasharray="4 4" />
        <g class="anno-card" transform="translate(210, 525)">
          <rect width="390" height="78" rx="14" fill="#180A10" stroke="rgba(244, 63, 94, 0.7)" stroke-width="1.8" />
          <text x="20" y="32" class="anno-hash" fill="var(--pink)">branch bugfix/nav</text>
          <text x="20" y="60" class="anno-msg">Быстрая ветка починки меню</text>
        </g>
      </g>

      <!-- Подпись Merge Feature C9 -->
      <g id="anno-merge" class="annotation" data-step="6">
        <line x1="950" y1="310" x2="720" y2="310" stroke="rgba(223, 255, 79, 0.6)" stroke-width="2" stroke-dasharray="4 4" />
        <g class="anno-card" transform="translate(230, 270)">
          <rect width="470" height="88" rx="14" fill="#12131A" stroke="var(--gold)" stroke-width="2" />
          <text x="20" y="35" class="anno-title" fill="var(--gold)">git merge feature/login</text>
          <text x="20" y="67" class="anno-msg">Слияние в main (2 родителя)</text>
        </g>
      </g>

      <!-- 10. ФИНАЛЬНАЯ ЛЕГЕНДА (ШАГ 8) -->
      <g id="legend-card" transform="translate(1320, 140)">
        <rect width="540" height="520" rx="20" fill="rgba(14, 16, 24, 0.95)" stroke="rgba(223, 255, 79, 0.4)" stroke-width="2" filter="url(#shadow-dark)" />
        <text x="32" y="52" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">МЕТАФОРА ДУБА В GIT</text>
        <line x1="32" y1="72" x2="508" y2="72" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

        <!-- Пункт 1: Ствол -->
        <circle cx="52" cy="115" r="12" fill="var(--gold)" filter="url(#glow-gold)" />
        <text x="82" y="123" font-size="22" font-weight="800" fill="var(--gold)">СТВОЛ = MAIN</text>
        <text x="82" y="147" font-size="18" fill="#AAAAB8">Главная непрерывная линия жизни проекта</text>

        <!-- Пункт 2: Ветвь -->
        <circle cx="52" cy="195" r="12" fill="var(--cyan)" filter="url(#glow-cyan)" />
        <text x="82" y="203" font-size="22" font-weight="800" fill="var(--cyan)">ВЕТВЬ = BRANCH</text>
        <text x="82" y="227" font-size="18" fill="#AAAAB8">Изолированная разработка новой функции</text>

        <!-- Пункт 3: Узел -->
        <circle cx="52" cy="275" r="10" fill="#FFF" stroke="var(--gold)" stroke-width="4" />
        <text x="82" y="283" font-size="22" font-weight="800" fill="#FFFFFF">УЗЕЛ = COMMIT</text>
        <text x="82" y="307" font-size="18" fill="#AAAAB8">Несгораемый снимок кода в истории</text>

        <!-- Пункт 4: Слияние -->
        <path d="M 40 355 Q 52 355 64 365" stroke="var(--cyan)" stroke-width="5" fill="none" />
        <text x="82" y="363" font-size="22" font-weight="800" fill="#DDD">СЛИЯНИЕ = MERGE</text>
        <text x="82" y="387" font-size="18" fill="#AAAAB8">Врастание ветви обратно в основной ствол</text>

        <!-- Пункт 5: HEAD -->
        <polygon points="52,430 58,444 46,444" fill="var(--gold)" />
        <text x="82" y="443" font-size="22" font-weight="800" fill="var(--gold)">МАРКЕР = HEAD</text>
        <text x="82" y="467" font-size="18" fill="#AAAAB8">Указатель: где вы находитесь прямо сейчас</text>

        <!-- Пункт 6: Бирка -->
        <rect x="42" y="492" width="22" height="14" rx="3" fill="var(--gold)" />
        <text x="82" y="505" font-size="20" font-weight="800" fill="#FFFFFF">БИРКА = TAG (v1.0)</text>
      </g>
    </svg>

    <!-- ВЕРХНИЙ ТЕКСТОВЫЙ HUD (ЗАГОЛОВКИ ШАГОВ) -->
    <header class="hud-top">
      <div class="hud-title-group">
        <div class="hud-eyebrow">
          <span class="hud-step-badge" id="hud-badge">ШАГ 0 / 8</span>
          <span>ВЕЛИКИЙ ДУБ РЕПОЗИТОРИЯ</span>
        </div>
        <h1 class="hud-heading" id="hud-title">Git как дерево: Commit, Branch, Merge</h1>
        <p class="hud-desc" id="hud-desc">Нажмите «Пробел» или стрелку «Вправо», чтобы запустить рост проекта.</p>
      </div>
      <div class="progress-dots" id="dots-container"></div>
    </header>

    <!-- НИЖНЯЯ ПАНЕЛЬ С КНОПКАМИ И ПОДСКАЗКАМИ КЛАВИАТУРЫ -->
    <footer class="hud-controls">
      <div class="controls-keys">
        <span class="key-pill"><kbd>→</kbd> / <kbd>Space</kbd> Шаг вперёд</span>
        <span class="key-pill"><kbd>←</kbd> Шаг назад</span>
        <span class="key-pill"><kbd>A</kbd> Автопроигрывание</span>
        <span class="key-pill"><kbd>R</kbd> Сброс</span>
      </div>

      <div class="nav-buttons">
        <button class="btn" id="btn-prev" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg> Назад
        </button>
        <button class="btn btn-primary" id="btn-next">
          Вперёд <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="btn" id="btn-auto">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> Авто
        </button>
        <button class="btn" id="btn-reset">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      // Шаги анимации и описания
      const steps = [
        {
          badge: "ШАГ 0 / 8",
          title: "Git как дерево: Commit, Branch, Merge",
          desc: "Визуальная метафора: каждый проект в Git растёт снизу вверх, подобно могучему дубу.",
          headPos: null
        },
        {
          badge: "ШАГ 1 / 8",
          title: "git init: Репозиторий создан",
          desc: "Появляется первый коммит (Initial commit) в корнях проекта. Указатель HEAD встаёт на него.",
          headPos: { x: 960, y: 910 }
        },
        {
          badge: "ШАГ 2 / 8",
          title: "main: Главный ствол проекта",
          desc: "Ствол растёт вверх: добавляются коммиты с версткой и шапкой сайта. Время течёт снизу вверх.",
          headPos: { x: 970, y: 610 }
        },
        {
          badge: "ШАГ 3 / 8",
          title: "git branch & switch: Новая ветка",
          desc: "Из коммита вырастает изолированная голубая ветвь feature/login. HEAD переключается на неё.",
          headPos: { x: 1210, y: 680 }
        },
        {
          badge: "ШАГ 4 / 8",
          title: "Параллельная разработка",
          desc: "На ветке feature пишутся новые коммиты, а ствол main живёт своей жизнью. Ветки независимы!",
          headPos: { x: 1360, y: 520 }
        },
        {
          badge: "ШАГ 5 / 8",
          title: "Ветка bugfix и быстрое слияние",
          desc: "Появилась розовая ветка для срочной правки бага и тут же влилась в ствол main.",
          headPos: { x: 955, y: 460 }
        },
        {
          badge: "ШАГ 6 / 8",
          title: "git merge: Вливание фичи в ствол",
          desc: "Голубая ветвь врастает обратно в ствол. Рождается коммит слияния со вспышкой света (2 родителя).",
          headPos: { x: 950, y: 310 }
        },
        {
          badge: "ШАГ 7 / 8",
          title: "git tag v1.0: Релизная бирка",
          desc: "На верхнем готовом коммите закрепляется несгораемая золотая метка релиза v1.0.",
          headPos: { x: 950, y: 170 }
        },
        {
          badge: "ШАГ 8 / 8",
          title: "Полная картина: Дуб контроля версий",
          desc: "Ствол = main · Ветви = branches · Узлы = commits · Слияния = merges · Маркер = HEAD.",
          headPos: { x: 950, y: 170 }
        }
      ];

      let currentStep = 0;
      let autoTimer = null;

      // Элементы DOM
      const hudBadge = document.getElementById('hud-badge');
      const hudTitle = document.getElementById('hud-title');
      const hudDesc = document.getElementById('hud-desc');
      const dotsContainer = document.getElementById('dots-container');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnAuto = document.getElementById('btn-auto');
      const btnReset = document.getElementById('btn-reset');
      const canvas = document.getElementById('canvas');
      const headMarker = document.getElementById('head-marker');

      // Создание точек прогресса
      steps.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'p-dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goToStep(i));
        dotsContainer.appendChild(dot);
      });

      function updateHUD(stepIndex) {
        const s = steps[stepIndex];
        hudBadge.textContent = s.badge;
        hudTitle.textContent = s.title;
        hudDesc.textContent = s.desc;

        // Обновление точек
        const dots = dotsContainer.querySelectorAll('.p-dot');
        dots.forEach((d, i) => {
          d.classList.toggle('active', i === stepIndex);
          d.classList.toggle('done', i < stepIndex);
        });

        btnPrev.disabled = stepIndex === 0;
        btnNext.disabled = stepIndex === steps.length - 1;
        btnNext.textContent = stepIndex === steps.length - 1 ? 'Завершено' : 'Вперёд →';
      }

      function updateTree(stepIndex) {
        // Управление ростом световых жилок
        const pMain = document.getElementById('path-main');
        const pFeature = document.getElementById('path-feature');
        const pFeatureMerge = document.getElementById('path-feature-merge');
        const pBugfix = document.getElementById('path-bugfix');
        const pBugfixMerge = document.getElementById('path-bugfix-merge');

        // Main
        pMain.classList.toggle('branch-grown', stepIndex >= 1);
        // Feature
        pFeature.classList.toggle('branch-grown', stepIndex >= 3);
        // Bugfix
        pBugfix.classList.toggle('branch-grown', stepIndex >= 5);
        pBugfixMerge.classList.toggle('branch-grown', stepIndex >= 5);
        // Feature merge
        pFeatureMerge.classList.toggle('branch-grown', stepIndex >= 6);

        // Вспышки
        const flashBugfix = document.getElementById('flash-bugfix');
        const flashFeature = document.getElementById('flash-feature');
        if (stepIndex === 5) {
          flashBugfix.classList.add('flash-active');
          setTimeout(() => flashBugfix.classList.remove('flash-active'), 900);
        }
        if (stepIndex === 6) {
          flashFeature.classList.add('flash-active');
          setTimeout(() => flashFeature.classList.remove('flash-active'), 1100);
        }

        // Коммиты
        document.getElementById('commit-1').classList.toggle('commit-visible', stepIndex >= 1);
        document.getElementById('commit-2').classList.toggle('commit-visible', stepIndex >= 2);
        document.getElementById('commit-3').classList.toggle('commit-visible', stepIndex >= 2);
        document.getElementById('commit-4').classList.toggle('commit-visible', stepIndex >= 4);
        document.getElementById('commit-5').classList.toggle('commit-visible', stepIndex >= 4);
        document.getElementById('commit-6').classList.toggle('commit-visible', stepIndex >= 4);
        document.getElementById('commit-7').classList.toggle('commit-visible', stepIndex >= 5);
        document.getElementById('commit-merge-bugfix').classList.toggle('commit-visible', stepIndex >= 5);
        document.getElementById('commit-merge-feature').classList.toggle('commit-visible', stepIndex >= 6);
        document.getElementById('commit-release').classList.toggle('commit-visible', stepIndex >= 7);

        // Бирка v1.0
        const tagBadge = document.getElementById('tag-badge');
        tagBadge.classList.toggle('tag-visible', stepIndex >= 7);

        // Выноски
        document.getElementById('anno-1').classList.toggle('annotation-visible', stepIndex >= 1 && stepIndex <= 3);
        document.getElementById('anno-main').classList.toggle('annotation-visible', stepIndex >= 2 && stepIndex <= 5);
        document.getElementById('anno-feature').classList.toggle('annotation-visible', stepIndex >= 3 && stepIndex <= 5);
        document.getElementById('anno-c5').classList.toggle('annotation-visible', stepIndex >= 4 && stepIndex <= 6);
        document.getElementById('anno-bugfix').classList.toggle('annotation-visible', stepIndex === 5);
        document.getElementById('anno-merge').classList.toggle('annotation-visible', stepIndex >= 6);

        // HEAD маркер
        const head = steps[stepIndex].headPos;
        if (head) {
          headMarker.style.opacity = '1';
          headMarker.setAttribute('transform', `translate(${head.x}, ${head.y})`);
        } else {
          headMarker.style.opacity = '0';
        }

        // Финальный шаг 8: легкое отдаление камеры и появление легенды
        canvas.classList.toggle('zoom-out', stepIndex === 8);
        document.getElementById('legend-card').classList.toggle('legend-visible', stepIndex === 8);
      }

      function goToStep(index) {
        currentStep = Math.max(0, Math.min(index, steps.length - 1));
        updateHUD(currentStep);
        updateTree(currentStep);
      }

      function nextStep() {
        if (currentStep < steps.length - 1) {
          goToStep(currentStep + 1);
        } else if (autoTimer) {
          stopAutoplay();
        }
      }

      function prevStep() {
        if (currentStep > 0) goToStep(currentStep - 1);
      }

      function toggleAutoplay() {
        if (autoTimer) {
          stopAutoplay();
        } else {
          startAutoplay();
        }
      }

      function startAutoplay() {
        btnAuto.style.background = 'var(--gold)';
        btnAuto.style.color = '#07080D';
        btnAuto.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Пауза';
        if (currentStep === steps.length - 1) goToStep(0);
        autoTimer = setInterval(() => {
          if (currentStep < steps.length - 1) {
            nextStep();
          } else {
            stopAutoplay();
          }
        }, 3200);
      }

      function stopAutoplay() {
        clearInterval(autoTimer);
        autoTimer = null;
        btnAuto.style.background = '';
        btnAuto.style.color = '';
        btnAuto.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> Авто';
      }

      // Слушатели кнопок
      btnNext.addEventListener('click', nextStep);
      btnPrev.addEventListener('click', prevStep);
      btnReset.addEventListener('click', () => { stopAutoplay(); goToStep(0); });
      btnAuto.addEventListener('click', toggleAutoplay);

      // Клик по холсту (кроме кнопок) переключает шаг
      canvas.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        nextStep();
      });

      // Клавиатурное управление
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          nextStep();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevStep();
        } else if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
          e.preventDefault();
          stopAutoplay();
          goToStep(0);
        } else if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') {
          e.preventDefault();
          toggleAutoplay();
        }
      });

      // Старт с Шага 0
      goToStep(0);
    })();
  </script>
</body>
</html>
